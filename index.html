<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Builder v1</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;-webkit-tap-highlight-color:transparent}
  canvas{width:100vw;height:100dvh;object-fit:contain;display:block}
  video{display:none}
  #start{position:fixed;inset:0;margin:auto;width:240px;height:64px;background:#00e5ff14;color:#00e5ff;border:2px solid #00e5ff;border-radius:32px;font:600 18px ui-monospace,monospace;letter-spacing:3px;box-shadow:0 0 24px #00e5ff99}
  #status{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;text-align:center;color:#00e5ff;font-size:13px;letter-spacing:3px;text-shadow:0 0 8px #00e5ff;pointer-events:none}
  #bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;display:none;justify-content:center;gap:10px}
  #bar button{color:#00e5ff;background:#00000088;border:1px solid #00e5ff;border-radius:18px;padding:10px 16px;font:13px ui-monospace,monospace;letter-spacing:1px}
  #help{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);left:0;right:0;text-align:center;color:#00e5ffaa;font-size:11px;display:none;pointer-events:none;padding:0 16px}
#bar{flex-wrap:wrap;gap:6px;padding:0 8px}
#bar button{padding:8px 12px;font-size:12px}
#help{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
#tools{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);left:0;right:0;display:none;justify-content:center;flex-wrap:wrap;gap:6px;padding:0 8px}
#tools button{color:#fff;background:#000000aa;border:1px solid #00e5ffaa;border-radius:14px;padding:7px 9px;font:11px ui-monospace,monospace}
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="status">HOLOGRAM INTERFACE OFFLINE</div>
<div id="help">CLAP x2 = OPEN WORLD &bull; CLAP x1 = CLOSE &bull; PINCH/TAP = BUILD</div>
<button id="start">START</button>
<div id="tools"><button data-a="tree">TREE</button><button data-a="house">HOUSE</button><button data-a="tower">TOWER</button><button data-a="peak">PEAK</button><button data-a="lake">LAKE</button><button data-a="rock">ROCK</button><button data-a="big">SIZE+</button><button data-a="small">SIZE-</button><button data-a="del">DEL</button><button data-a="sky">SKY</button><button data-a="wx">WEATHER</button><button data-a="biome">BIOME</button><button data-a="rand">RANDOM</button><button data-a="name">NAME</button><button data-a="save">SAVE</button></div>
<div id="bar"><button id="sphere">SPHERE</button><button id="theme">THEME</button><button id="flip">FLIP CAM</button><button id="sens">SENS: MED</button></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script>
const $=id=>document.getElementById(id);
const video=$('video'),cv=$('canvas'),ctx=cv.getContext('2d');
const THEMES=['#00e5ff','#ffb300','#39ff88','#ff3d6e'];
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const TIPS=[4,8,12,16,20];
let ti=0,C=THEMES[0],facing='user',stream=null,hands=null,latest=[],busy=false,running=false;
let trails={},parts=[],strokes=[[]],fistT=0,last=performance.now(),fps=60;
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function analyze(lm,w,h,mir){
  const p=lm.map(q=>({x:(mir?1-q.x:q.x)*w,y:q.y*h}));
  const palm=D(p[0],p[9]);
  const e=[D(p[4],p[17])>D(p[3],p[17])*1.02];
  for(const t of [8,12,16,20])e.push(D(p[0],p[t])>D(p[0],p[t-2])*1.05);
  const n=e.filter(Boolean).length;
  const pinch=D(p[4],p[8])<palm*0.38;
  const noF=!e[1]&&!e[2]&&!e[3]&&!e[4];
  let g=pinch?'PINCH':noF?'FIST':n==5?'OPEN PALM':(e[1]&&!e[2]&&!e[3]&&!e[4])?'POINT':(e[1]&&e[2]&&!e[3]&&!e[4])?'PEACE':n+' FINGERS';
  const cx=(p[0].x+p[5].x+p[9].x+p[13].x+p[17].x)/5,cy=(p[0].y+p[5].y+p[9].y+p[13].y+p[17].y)/5;
  return{p,palm,n,pinch,fist:noF&&!pinch,g,cx,cy};
}
function hex(x,y,r,rot){ctx.beginPath();for(let i=0;i<6;i++){const a=rot+i*Math.PI/3;ctx[i?'lineTo':'moveTo'](x+r*Math.cos(a),y+r*Math.sin(a));}ctx.closePath();ctx.stroke();}
function reticle(x,y,r,rot){for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(x,y,r,rot+i*2.094,rot+i*2.094+1.2);ctx.stroke();}}
function orb(x,y,r,t){
  ctx.save();ctx.globalAlpha=0.14;ctx.fillStyle=C;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.restore();
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
  for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(x,y,r,Math.abs(Math.cos(t+i*1.05))*r*0.9+1,i*1.05+t*0.3,0,7);ctx.stroke();}
}
function bracket(x,y,sx,sy,l){ctx.beginPath();ctx.moveTo(x,y+sy*l);ctx.lineTo(x,y);ctx.lineTo(x+sx*l,y);ctx.stroke();}

function drawBg(w,h,t){
  ctx.save();
  if(facing==='user'){ctx.translate(w,0);ctx.scale(-1,1);}
  ctx.drawImage(video,0,0,w,h);ctx.restore();
  ctx.fillStyle='rgba(0,8,14,.6)';ctx.fillRect(0,0,w,h);
}
function drawHand(H){
  const p=H.p;
  ctx.save();ctx.strokeStyle=C;ctx.shadowColor=C;ctx.shadowBlur=14;ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();for(const[a,b]of CONN){ctx.moveTo(p[a].x,p[a].y);ctx.lineTo(p[b].x,p[b].y);}ctx.stroke();
  ctx.fillStyle='#fff';for(const q of p){ctx.beginPath();ctx.arc(q.x,q.y,3,0,7);ctx.fill();}
  if(H.pinch){ctx.lineWidth=2;ctx.beginPath();ctx.arc((p[4].x+p[8].x)/2,(p[4].y+p[8].y)/2,14,0,7);ctx.stroke();}
  ctx.restore();
}
/* ===== WORLD BUILDER v1 ===== */
const cir=(n,f)=>Array.from({length:n+1},(_,i)=>{const a=i/n*6.2832;return f(Math.cos(a),Math.sin(a));});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cone=(r,y0,y1,n)=>{n=n||10;return[cir(n,(c,k)=>[c*r,y0,k*r]),[[r,y0,0],[0,y1,0]],[[-r,y0,0],[0,y1,0]],[[0,y0,r],[0,y1,0]],[[0,y0,-r],[0,y1,0]]];};
const box=(w,y0,y1)=>{const a=[[-w,y0,-w],[w,y0,-w],[w,y0,w],[-w,y0,w]],b=a.map(q=>[q[0],y1,q[2]]);return[[...a,a[0]],[...b,b[0]],...a.map((q,i)=>[q,b[i]])];};
const tube=(r,y0,y1)=>[cir(10,(c,k)=>[c*r,y0,k*r]),cir(10,(c,k)=>[c*r,y1,k*r]),[[r,y0,0],[r,y1,0]],[[-r,y0,0],[-r,y1,0]],[[0,y0,r],[0,y1,r]],[[0,y0,-r],[0,y1,-r]]];
const KINDS={
 tree:{n:'TREE',f:()=>[[[0,0,0],[0,-.1,0]],...cone(.1,-.08,-.2),...cone(.075,-.17,-.3),...cone(.05,-.26,-.4)]},
 house:{n:'HOUSE',f:()=>[...box(.1,0,-.1),...cone(.14,-.1,-.2,4)]},
 tower:{n:'TOWER',f:()=>[...tube(.05,0,-.5),...tube(.075,-.5,-.56),...cone(.09,-.56,-.72)]},
 peak:{n:'PEAK',f:()=>[...cone(.3,0,-.6,12),...cone(.18,0,-.36,10).map(l=>l.map(q=>[q[0]+.22,q[1],q[2]+.1]))]},
 lake:{n:'LAKE',f:t=>{const k=.4+.4*(.5+.5*Math.sin(t*2));return[cir(18,(c,z)=>[c*.22,0,z*.15]),cir(18,(c,z)=>[c*.22*k,0,z*.15*k])];}},
 rock:{n:'ROCK',f:()=>cone(.09,0,-.07,5)}
};
const BIOMES=[
 {n:'GRASS',g:'#39ff88',tree:'#2fe08a',house:'#ffc400',tower:'#b05cff',peak:'#cfd8e6',lake:'#2f7bff',rock:'#9aa7b8'},
 {n:'DESERT',g:'#ffb04a',tree:'#8bc34a',house:'#ffe0a3',tower:'#ff7a1a',peak:'#d98f4e',lake:'#35d6e8',rock:'#c9a27a'},
 {n:'SNOW',g:'#e8f6ff',tree:'#7fe3d0',house:'#ff6a6a',tower:'#9ad0ff',peak:'#ffffff',lake:'#6fb7ff',rock:'#b9c6d6'},
 {n:'ALIEN',g:'#b05cff',tree:'#ff3df2',house:'#39ffe0',tower:'#ffe14a',peak:'#ff6a3d',lake:'#7dff4a',rock:'#7a6bff'}
];
const SKYN=['DAY','SUNSET','NIGHT'],WXN=['CLEAR','RAIN','SNOW'];
let W=[{k:'tree',x:-.4,z:.3,s:1},{k:'tree',x:-.55,z:.1,s:.8},{k:'house',x:.15,z:.35,s:1},{k:'peak',x:.1,z:-.45,s:1},{k:'lake',x:.45,z:.15,s:1},{k:'tower',x:-.3,z:-.35,s:1}];
let tool='tree',selW=-1,yaw=.6,zoom=1,biome=0,sky=0,wx=0,worldName='MY WORLD',view={cx:0,cy:0,K:1};
const PITCH=.85,CP=Math.cos(PITCH),SP=Math.sin(PITCH);
const STARS=Array.from({length:40},()=>({u:Math.random()*2-1,v:Math.random()*2-1,p:Math.random()*6}));
const WP=Array.from({length:70},()=>({u:Math.random()*2-1,v:Math.random()*2-1,s:.4+Math.random()}));
let sph={open:false,t:0,ch:-9999},grab=null,two=null,claps=[],shocks=[],flash=0,peaceT=0;
let mic={ok:false,an:null,buf:null,lvl:0,floor:.01,sens:1,last:0};
const SENS=[['LOW',.4],['MED',.24],['HIGH',.14]];

async function initMic(){
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')await ac.resume();
    mic.an=ac.createAnalyser();mic.an.fftSize=1024;
    ac.createMediaStreamSource(st).connect(mic.an);
    mic.buf=new Float32Array(1024);mic.ok=true;
  }catch(e){mic.ok=false;}
}
function micTick(now){
  if(!mic.ok)return;
  mic.an.getFloatTimeDomainData(mic.buf);
  let pk=0,sum=0;for(const v of mic.buf){const a=Math.abs(v);if(a>pk)pk=a;sum+=v*v;}
  const rms=Math.sqrt(sum/mic.buf.length);
  mic.lvl=Math.max(pk,mic.lvl*0.9);
  if(pk>Math.max(SENS[mic.sens][1],mic.floor*8)&&rms>0.012&&pk>rms*3.2&&now-mic.last>130){mic.last=now;onClap(now);}
  mic.floor=mic.floor*0.99+rms*0.01;
}
function hiTool(){[...$('tools').children].forEach(x=>{x.style.background=x.dataset.a===tool?'#00e5ff66':'#000000aa';});}
function setSphere(o,now){
  if(sph.open===o)return;
  sph.open=o;sph.ch=now;shocks.push(now);grab=null;two=null;
  $('tools').style.display=o?'flex':'none';hiTool();
}
function onClap(now){
  flash=1;
  if(now-sph.ch<900)return;
  if(sph.open){setSphere(false,now);claps=[];return;}
  claps=claps.filter(c=>now-c<700);claps.push(now);
  if(claps.length>=2){setSphere(true,now);claps=[];}
}
function mkP(cx,cy,K){
  const co=Math.cos(yaw),si=Math.sin(yaw);
  return(x,y,z)=>{const xr=x*co+z*si,zr=-x*si+z*co,d=y*SP-zr*CP,f=1/(1+d*.2);return[cx+xr*K*f,cy+(zr*SP+y*CP)*K*f+K*.05,f,d];};
}
function toGround(sx,sy){
  const{cx,cy,K}=view;let f=1,xr=0,zr=0;
  for(let i=0;i<6;i++){xr=(sx-cx)/(K*f);zr=clamp((sy-cy-K*.05)/(K*f*SP),-2,2);f=1/(1-zr*CP*.2);}
  const co=Math.cos(yaw),si=Math.sin(yaw);return[xr*co-zr*si,xr*si+zr*co];
}
function drawWorld(cx,cy,R,t,al,dt){
  const K=R*.9*zoom,P=mkP(cx,cy,K),th=BIOMES[biome];view={cx,cy,K};
  // sky, sun/moon, stars
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R*.98,0,7);ctx.clip();
  const SK=[['#3aa0ff','#bfe9ff'],['#ff5a2d','#ffd27a'],['#05061a','#3a2a7e']][sky];
  const g=ctx.createLinearGradient(0,cy-R,0,cy+R);g.addColorStop(0,SK[0]);g.addColorStop(1,SK[1]);
  ctx.globalAlpha=al*.4;ctx.fillStyle=g;ctx.fillRect(cx-R,cy-R,2*R,2*R);
  if(sky==2){ctx.fillStyle='#fff';for(const q of STARS){ctx.globalAlpha=al*(.4+.6*Math.abs(Math.sin(t+q.p)));ctx.fillRect(cx+q.u*R,cy+q.v*R*.7-R*.2,2,2);}}
  ctx.globalAlpha=al;
  const sx=cx+R*.55*Math.sin(t*.15),sy=sky==1?cy-R*.18:cy-R*.62+R*.06*Math.cos(t*.15);
  ctx.shadowColor=sky==2?'#cfe0ff':'#fff3a0';ctx.shadowBlur=25;ctx.fillStyle=sky==2?'#e8f0ff':sky==1?'#ff9a3d':'#fff3a0';
  ctx.beginPath();ctx.arc(sx,sy,R*(sky==1?.12:.08),0,7);ctx.fill();
  if(sky==2){ctx.shadowBlur=0;ctx.fillStyle='#0a0c26';ctx.beginPath();ctx.arc(sx+R*.035,sy-R*.01,R*.07,0,7);ctx.fill();}
  ctx.restore();
  // ground island
  ctx.save();ctx.strokeStyle=th.g;ctx.fillStyle=th.g;ctx.shadowColor=th.g;ctx.shadowBlur=10;ctx.lineWidth=1.2;ctx.globalAlpha=al;
  const ring=(r,y)=>{ctx.beginPath();for(let i=0;i<=28;i++){const a=i/28*6.2832,q=P(Math.cos(a)*r,y,Math.sin(a)*r);if(i)ctx.lineTo(q[0],q[1]);else ctx.moveTo(q[0],q[1]);}ctx.stroke();};
  ring(.9,0);ctx.globalAlpha=al*.2;ctx.fill();ctx.globalAlpha=al*.7;ring(.6,0);ring(.3,0);ring(.9,.07);
  ctx.beginPath();const o0=P(0,0,0);
  for(let i=0;i<8;i++){const a=i*Math.PI/4,q=P(Math.cos(a)*.9,0,Math.sin(a)*.9);ctx.moveTo(o0[0],o0[1]);ctx.lineTo(q[0],q[1]);}
  ctx.stroke();ctx.globalAlpha=al*.5;ctx.beginPath();const ap=P(0,.55,0);
  for(let i=0;i<6;i++){const a=i*Math.PI/3,q=P(Math.cos(a)*.9,.07,Math.sin(a)*.9);ctx.moveTo(q[0],q[1]);ctx.lineTo(ap[0],ap[1]);}
  ctx.stroke();ctx.restore();
  // objects (far to near)
  const order=W.map((o,i)=>i).sort((a,b)=>P(W[b].x,0,W[b].z)[3]-P(W[a].x,0,W[a].z)[3]);
  for(const i of order){
    const o=W[i],col=th[o.k],isSel=i===selW;
    ctx.save();ctx.globalAlpha=al;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=isSel?22:10;ctx.lineWidth=isSel?2.4:1.5;
    for(const l of KINDS[o.k].f(t)){
      ctx.beginPath();
      l.forEach((q,k)=>{const r=P(o.x+q[0]*o.s,q[1]*o.s,o.z+q[2]*o.s);if(k)ctx.lineTo(r[0],r[1]);else ctx.moveTo(r[0],r[1]);});
      ctx.stroke();if(l.length>4){ctx.globalAlpha=al*.12;ctx.fill();ctx.globalAlpha=al;}
    }
    ctx.restore();
    const m=P(o.x,-.15*o.s,o.z),b=P(o.x,0,o.z);o.sx=m[0];o.sy=m[1];o.sf=m[2];o.by=b[1];
    if(isSel){ctx.save();ctx.globalAlpha=al;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;reticle(m[0],m[1],26*m[2]+8,t*2);ctx.restore();}
  }
  // weather
  if(wx){
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,R*.98,0,7);ctx.clip();
    ctx.strokeStyle=ctx.fillStyle=wx==1?'#9fd4ff':'#fff';ctx.globalAlpha=al*.8;ctx.lineWidth=1;
    for(const q of WP){
      q.v+=dt*.0006*q.s*(wx==1?3:1);if(q.v>1){q.v=-1;q.u=Math.random()*2-1;}
      if(wx==2)q.u+=Math.sin(t+q.s*9)*.0005;
      if(q.u*q.u+q.v*q.v>.9)continue;
      const x=cx+q.u*R*.95,y=cy+q.v*R*.95;
      if(wx==1){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-2,y+9);ctx.stroke();}else ctx.fillRect(x,y,2.5,2.5);
    }
    ctx.restore();
  }
}
function pickW(x,y,lim){
  let bi=-1,bd=1e9;
  W.forEach((o,i)=>{if(o.sx==null)return;const d=Math.hypot(o.sx-x,o.sy-y),l=lim*(o.sf||1)*Math.max(.8,o.s);if(d<l&&d<bd){bd=d;bi=i;}});
  return bi;
}
function placeAt(x,y){
  const g=toGround(x,y);
  if(Math.hypot(g[0],g[1])<.88&&W.length<80){W.push({k:tool,x:g[0],z:g[1],s:1});selW=W.length-1;}
}
function randomWorld(){
  W=[];selW=-1;
  for(let i=0;i<26;i++){
    const r=Math.random(),k=r<.45?'tree':r<.6?'house':r<.7?'tower':r<.8?'peak':r<.88?'lake':'rock';
    const a=Math.random()*6.2832,d=Math.sqrt(Math.random())*.78;
    W.push({k,x:Math.cos(a)*d,z:Math.sin(a)*d,s:k=='lake'?.8+Math.random()*.6:.7+Math.random()*.7});
  }
}
function interact(hs,dt,now){
  const pins=[];
  hs.forEach(H=>{if(H.pinch)pins.push({x:(H.p[4].x+H.p[8].x)/2,y:(H.p[4].y+H.p[8].y)/2});});
  peaceT=hs.some(H=>H.g==='PEACE')?peaceT+dt:0;
  if(peaceT>700){sky=(sky+1)%3;peaceT=-700;}
  if(!pins.length){
    if(grab&&!grab.moved&&grab.item<0&&now-grab.t0<600)placeAt(grab.x0,grab.y0);
    grab=null;two=null;return;
  }
  if(pins.length>=2){
    const d=Math.hypot(pins[0].x-pins[1].x,pins[0].y-pins[1].y);
    if(two&&two>20)zoom=clamp(zoom*d/two,.6,1.8);
    two=d;grab=null;return;
  }
  two=null;const a=pins[0];
  if(!grab){
    const it=pickW(a.x,a.y,45);grab={x0:a.x,y0:a.y,x:a.x,t0:now,moved:false,item:it,ox:0,oy:0};
    if(it>=0){selW=it;grab.ox=W[it].sx-a.x;grab.oy=W[it].by-a.y;}
  }else{
    if(Math.hypot(a.x-grab.x0,a.y-grab.y0)>14)grab.moved=true;
    if(grab.item>=0){
      if(grab.moved){const g=toGround(a.x+grab.ox,a.y+grab.oy),o=W[grab.item],m=Math.hypot(g[0],g[1]),l=m>.85?.85/m:1;o.x=g[0]*l;o.z=g[1]*l;}
    }else yaw+=(a.x-grab.x)*.012;
    grab.x=a.x;
  }
}
function workspace(w,h,t,dt,hs){
  dt=Math.min(dt,50);const now=t*1000;
  micTick(now);
  const cx=w/2,cy=h/2,Rm=Math.min(w,h)*0.46;
  sph.t=clamp(sph.t+(sph.open?1:-1)*dt/700,0,1);
  const e=sph.t*sph.t*(3-2*sph.t),R=Rm*(0.13+0.87*e);
  if(!grab)yaw+=dt*0.00015;
  ctx.save();ctx.strokeStyle=C;ctx.fillStyle=C;ctx.shadowColor=C;ctx.shadowBlur=16;
  if(flash>0){ctx.globalAlpha=flash*0.3;ctx.beginPath();ctx.arc(cx,cy,R*1.05,0,7);ctx.fill();flash-=dt/250;}
  ctx.globalAlpha=0.4-0.2*e+(1-e)*0.25*Math.sin(t*4);
  ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
  ctx.lineWidth=1;
  for(let i=0;i<6;i++){const a=i*Math.PI/6+t*0.4;ctx.beginPath();ctx.ellipse(cx,cy,Math.abs(R*Math.cos(a))+0.5,R,0,0,7);ctx.stroke();}
  for(let j=-2;j<=2;j++){const la=j*0.5,rx=R*Math.cos(la);ctx.beginPath();ctx.ellipse(cx,cy+R*Math.sin(la),rx,rx*0.22,0,0,7);ctx.stroke();}
  shocks=shocks.filter(s=>now-s<900);
  for(const s of shocks){const k=(now-s)/900;ctx.globalAlpha=1-k;ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,Rm*(0.15+k),0,7);ctx.stroke();}
  ctx.restore();
  if(e>0.35){drawWorld(cx,cy,R,t,clamp((e-0.35)/0.65,0,1),dt);if(e>0.9)interact(hs,dt,now);}
  ctx.save();ctx.fillStyle=C;ctx.shadowColor=C;ctx.shadowBlur=8;ctx.font='11px ui-monospace,monospace';
  ctx.textAlign='right';
  ctx.fillText(sph.open?'CLAP ONCE TO CLOSE':(mic.ok?'CLAP TWICE':'MIC OFF'),w-22,40);
  ctx.fillText(sph.open?'TAP/PINCH GROUND = BUILD':(mic.ok?'TO OPEN WORLD':'USE SPHERE BUTTON'),w-22,56);
  ctx.fillText('MIC '+SENS[mic.sens][0],w-22,76);
  ctx.strokeStyle=C;ctx.lineWidth=1;ctx.strokeRect(w-122,82,100,6);ctx.fillRect(w-122,82,100*clamp(mic.lvl,0,1),6);
  if(sph.open){
    ctx.textAlign='left';ctx.font='bold 12px ui-monospace,monospace';
    ctx.fillText('WORLD BUILDER v1 // '+worldName,22,40);ctx.font='11px ui-monospace,monospace';
    ctx.fillText('TOOL '+KINDS[tool].n+' | ITEMS '+W.length,22,56);
    ctx.fillText(BIOMES[biome].n+' | '+SKYN[sky]+' | '+WXN[wx],22,72);
  }
  ctx.restore();
}
function saveImg(){
  cv.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=worldName.replace(/ /g,'-').toLowerCase()+'-world.png';a.click();
    setTimeout(()=>URL.revokeObjectURL(u),2000);});
}

function draw(now){
  const w=cv.width,h=cv.height,dt=now-last;last=now;
  const t=now/1000,mir=facing==='user';
  drawBg(w,h,t);
  const hs=latest.map(l=>analyze(l,w,h,mir));
  workspace(w,h,t,dt,hs);
  hs.forEach(drawHand);
}
async function startCamera(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:480}},audio:false});
  video.srcObject=stream;await video.play();
  cv.width=video.videoWidth;cv.height=video.videoHeight;
}
async function loop(now){
  if(!busy&&video.readyState>=2){busy=true;try{await hands.send({image:video});}catch(e){}busy=false;}
  draw(now||performance.now());
  requestAnimationFrame(loop);
}
$('start').onclick=async()=>{
  $('start').style.display='none';$('status').textContent='LOADING MODEL...';
  try{
    await startCamera();
    initMic();hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+f});
    hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.6,minTrackingConfidence:0.6});
    hands.onResults(r=>{latest=r.multiHandLandmarks||[];if(!running){running=true;$('status').style.display='none';}});
    $('bar').style.display='flex';$('help').style.display='block';
    setTimeout(()=>{$('help').style.display='none'},8000);
    requestAnimationFrame(loop);
  }catch(e){$('status').textContent='CAMERA ERROR: '+e.message;$('start').style.display='block';}
};
$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';latest=[];trails={};await startCamera();};

$('theme').onclick=()=>{ti=(ti+1)%THEMES.length;C=THEMES[ti];};
$('sphere').onclick=()=>setSphere(!sph.open,performance.now());
$('sens').onclick=()=>{mic.sens=(mic.sens+1)%3;$('sens').textContent='SENS: '+SENS[mic.sens][0];};
$('tools').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
  if(KINDS[a])tool=a;
  else if(a==='big'&&selW>=0)W[selW].s=Math.min(2.5,W[selW].s*1.2);
  else if(a==='small'&&selW>=0)W[selW].s=Math.max(.4,W[selW].s/1.2);
  else if(a==='del'&&selW>=0){W.splice(selW,1);selW=-1;}
  else if(a==='sky')sky=(sky+1)%3;
  else if(a==='wx')wx=(wx+1)%3;
  else if(a==='biome')biome=(biome+1)%BIOMES.length;
  else if(a==='rand')randomWorld();
  else if(a==='name'){const n=prompt('World name?',worldName);if(n)worldName=n.slice(0,16).toUpperCase();}
  else if(a==='save')saveImg();
  hiTool();
};
cv.addEventListener('pointerdown',e=>{
  if(!sph.open||sph.t<.9)return;
  const r=cv.getBoundingClientRect(),k=Math.min(r.width/cv.width,r.height/cv.height);
  const x=(e.clientX-r.left-(r.width-cv.width*k)/2)/k,y=(e.clientY-r.top-(r.height-cv.height*k)/2)/k;
  const b=pickW(x,y,40);if(b>=0)selW=b;else placeAt(x,y);
});
</script>
